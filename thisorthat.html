<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This or That 💙</title>

  <!-- Favicon — tiny heart -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="thisorthat.css">
</head>
<body>

  <!-- floating background hearts -->
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="container">

    <!-- header -->
    <header class="game-header">
      <h1>This or That</h1>
      <p>Pick one. No overthinking. Just what feels right. 💙</p>
    </header>

    <!-- progress -->
    <div class="progress-wrap">
      <div class="progress-bar-custom" id="progressBar"></div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>

    <!-- game area -->
    <div class="game-area" id="gameArea">

      <!-- intro card -->
      <div class="intro-card" id="introCard">
        <div class="intro-icon"><i class="fas fa-heart"></i></div>
        <h2>Ready?</h2>
        <p>There are no wrong answers. Just tap whichever one you'd pick — and at the end you'll see all your choices together.</p>
        <button class="start-btn" id="startBtn">
          <i class="fas fa-play"></i> Start
        </button>
      </div>

      <!-- question card -->
      <div class="question-card" id="questionCard">
        <p class="question-num" id="questionNum">Question 1</p>
        <h2 class="question-text" id="questionText">Pizza or Sushi?</h2>

        <div class="choices">
          <button class="choice-btn" data-choice="a" id="choiceA">
            <span class="choice-icon"><i class="fas fa-utensils"></i></span>
            <span class="choice-label" id="choiceALabel">Pizza</span>
          </button>
          <button class="choice-btn" data-choice="b" id="choiceB">
            <span class="choice-icon"><i class="fas fa-fish"></i></span>
            <span class="choice-label" id="choiceBLabel">Sushi</span>
          </button>
        </div>

        <button class="back-btn" id="backBtn">
          <i class="fas fa-arrow-left"></i> Previous
        </button>
      </div>

      <!-- results card -->
      <div class="results-card" id="resultsCard">
        <div class="results-icon"><i class="fas fa-star"></i></div>
        <h2>Here's what you picked 💙</h2>
        <ul class="results-list" id="resultsList"></ul>
        <div class="results-actions">
          <button class="start-btn" id="playAgainBtn">
            <i class="fas fa-redo"></i> Play again
          </button>
          <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to our page
          </a>
        </div>
      </div>

    </div>

    <!-- back link (during game) -->
    <div class="back-wrapper" id="backWrapper">
      <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to our page
      </a>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Game script -->
  <script src="thisorthat.js"></script>

</body>
</html>
