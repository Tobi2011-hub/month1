<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Notes 💙</title>

  <!-- Favicon — tiny heart -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Notes stylesheet -->
  <link rel="stylesheet" href="notes.css">
</head>
<body>

  <!-- floating background hearts -->
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="container">

    <!-- header -->
    <header class="notes-header">
      <h1>Our Notes</h1>
      <p>A little space for us — leave a note for each other, whenever you want. 💙</p>
    </header>

    <!-- who am I toggle -->
    <div class="who-toggle">
      <button class="who-btn active" data-author="him">
        <i class="fas fa-user"></i> Me
      </button>
      <button class="who-btn" data-author="her">
        <i class="fas fa-heart"></i> Simi
      </button>
    </div>

    <!-- composer -->
    <div class="composer">
      <textarea id="noteInput" maxlength="500" placeholder="Write something... 💙"></textarea>
      <div class="composer-footer">
        <span class="char-count" id="charCount">0 / 500</span>
        <button class="send-btn" id="sendBtn" disabled>
          <i class="fas fa-paper-plane"></i> Leave note
        </button>
      </div>
    </div>

    <!-- toolbar -->
    <div class="notes-toolbar">
      <span class="notes-count" id="notesCount"><strong>0</strong> notes</span>
      <div class="toolbar-actions">
        <button class="icon-btn" id="exportBtn" title="Download notes as a JSON file">
          <i class="fas fa-download"></i> Export
        </button>
        <button class="icon-btn" id="importBtn" title="Load notes from a JSON file">
          <i class="fas fa-upload"></i> Import
        </button>
        <button class="icon-btn danger" id="clearBtn" title="Delete all notes">
          <i class="fas fa-trash"></i> Clear
        </button>
        <input type="file" id="importInput" accept=".json,.txt" hidden>
      </div>
    </div>

    <!-- notes list -->
    <div class="notes-list" id="notesList"></div>

    <!-- back link -->
    <div class="back-wrapper">
      <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to our page
      </a>
    </div>

  </div>

  <!-- toast -->
  <div class="toast-msg" id="toast">
    <i class="fas fa-check-circle"></i> <span id="toastText">Saved</span>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Notes script -->
  <script src="notes.js"></script>

</body>
</html>
